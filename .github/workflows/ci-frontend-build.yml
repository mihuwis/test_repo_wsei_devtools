name: CI - Frontend build

on:
  push:
    branches: ["github_actions"]
  pull_request:
    branches: ["github_actions"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training-app/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: training-app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
